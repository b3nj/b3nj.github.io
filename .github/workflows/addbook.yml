name: Automatically generate new jekyll page per book

on:
  push:
    branches:
      - gh-pages
    paths:
      - _data/books.json

jobs:
  generatefiles:
  # because we're adding a file and deleting one existing from the current commit, it is required that write permissions are given
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: 'gh-pages'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: pip install pyyaml

    - name: Generate book pages
      run: |
        python3 scripts/generate_book_pages.py
        echo "Books folder contents:"
        find books/ -type f || echo "books/ folder is empty or missing"

    - name: Add new files and commit
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A books/ _data/books.json
        git diff --cached --quiet || git commit -m 'Automatically added new book' && git push

  notify-new-book:
    runs-on: ubuntu-latest
    needs: generatefiles
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Extract new book and send notification
        env:
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://bkraft.fr
        run: |
          python3 << 'EOF'
          import json, os, subprocess, html, re

          def slugify(text):
              text = re.sub(r"[^\w\s-]", "", text.lower())
              return re.sub(r"[-\s]+", "-", text).strip("-")
          
          def get_isbn(book):
              identifiers = book.get("industryIdentifiers", [])
              return next((e["identifier"] for e in identifiers if e.get("type") == "ISBN_13"), None) or \
                    next((e["identifier"] for e in identifiers if e.get("type") == "ISBN_10"), None)

          # Find the book that was added by diffing books.json
          old = subprocess.run(
              ["git", "show", "HEAD~2:_data/books.json"],
              capture_output=True, text=True
          )
          new = subprocess.run(
              ["git", "show", "HEAD~1:_data/books.json"],
              capture_output=True, text=True
          )

          old_books = json.loads(old.stdout) if old.returncode == 0 else []
          new_books = json.loads(new.stdout)

          # Dedup by Google Books volume id
          old_isbns = {get_isbn(b) for b in old_books}
          added = [b for b in new_books if get_isbn(b) not in old_isbns]

          print(f"HEAD~2 returncode: {old.returncode}")
          print(f"HEAD~1 returncode: {new.returncode}")
          print(f"old_isbns: {old_isbns}")
          print(f"new isbns: {[get_isbn(b) for b in new_books]}")
          print(f"added count: {len(added)}")

          if not added:
              print("No new book detected, skipping notification")
              exit(0)

          book = added[0]

          title   = html.escape(book.get("title", "Unknown title"))
          slug    = slugify(book.get("title", ""))
          authors = html.escape(", ".join(book.get("authors", ["Unknown author"])))
          publisher = html.escape(book.get("publisher", ""))
          year    = book.get("publishedDate", "")[:4]
          pages   = book.get("pageCount", "")

          identifiers = book.get("industryIdentifiers", [])
          isbn = next((e["identifier"] for e in identifiers if e.get("type") == "ISBN_13"), None) or \
                next((e["identifier"] for e in identifiers if e.get("type") == "ISBN_10"), None)

          image_links = book.get("imageLinks", {})
          cover_url = (image_links.get("thumbnail") or image_links.get("smallThumbnail") or "").replace("http://", "https://")

          language  = html.escape(book.get("language", ""))
          categories = book.get("categories", [])[:5]
          canonical  = book.get("canonicalVolumeLink", "")

          site_url  = os.environ.get("SITE_URL", "")
          book_url  = f"{site_url}/books/{slug}/" if slug else ""

          lines = [f"📖 <b>{title}</b>"]
          lines.append(f"✍️ {authors}")
          if publisher: lines.append(f"🏢 {publisher}")
          if year:      lines.append(f"📅 {year}")
          if pages:     lines.append(f"📄 {pages} pages")
          if isbn:      lines.append(f"🔖 <code>{isbn}</code>")
          if language:  lines.append(f"🌐 {language}")
          if categories:
              lines.append("")
              lines.append("🏷 " + html.escape(", ".join(categories)))

          message = "\n".join(lines)

          buttons = []
          if book_url:  buttons.append({"text": "📚 My library", "url": book_url})
          if canonical: buttons.append({"text": "🔍 Google Books", "url": canonical})

          payload = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "parse_mode": "HTML",
              "text": message,
              "reply_markup": {"inline_keyboard": [buttons]}
          }

          import urllib.request
          token = os.environ["TELEGRAM_API_TOKEN"]

          if cover_url:
              photo_payload = {**payload, "photo": cover_url, "caption": message}
              photo_payload.pop("text", None)
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendPhoto",
                  data=json.dumps(photo_payload).encode(),
                  headers={"Content-Type": "application/json"}
              )
          else:
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"}
              )

          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())
              print("Telegram response:", result.get("ok"))

          EOF