name: HN Daily Digest

on:
  schedule:
    - cron: '0 7 * * *'   # schedule only runs from the default branch (main)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # main: holds the script
      - uses: actions/checkout@v4

      # gh-pages: the Jekyll source the digest is committed to
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Generate digest (Jekyll file + Telegram)
        env:
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HN_STORY_COUNT: '10'
          HN_MIN_SCORE: '100'
          OUT_DIR: site/_hackers
        run: python scripts/hn_digest.py

      - name: Commit to gh-pages
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _hackers/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hackers digest $(date -u +%Y-%m-%d)"
            git push origin gh-pages
          fi
