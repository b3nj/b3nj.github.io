# this action is related to gh-pages branch ... but as GH doesn't register workflows that are workflow_dispatch only on the main branch, had to put it here

name: "Add book to books.json from Apple shortcut"

on:
  workflow_dispatch:
    inputs:
      isbn:
        description: 'ISBN-10 or ISBN-13 (leave empty to search by title)'
        required: false
        default: ''
        type: string
      title:
        description: 'Book title (used when no ISBN)'
        required: false
        default: ''
        type: string
      author:
        description: 'Author (optional, narrows a title search)'
        required: false
        default: ''
        type: string
      target_file:
        description: 'target file'
        required: false
        default: '_data/books.json'
        type: string

jobs:
  append:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Inputs go through env vars, never inlined in the shell script:
      # apostrophes/quotes in titles can't break bash.
      - name: Look up book and append to JSON
        id: lookup
        env:
          INPUT_ISBN: ${{ inputs.isbn }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_AUTHOR: ${{ inputs.author }}
          TARGET_FILE: ${{ inputs.target_file }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://bkraft.fr
        run: python3 scripts/lookup_book.py

      - name: Commit and push
        if: steps.lookup.outputs.result == 'added'
        env:
          BOOK_TITLE: ${{ steps.lookup.outputs.title }}
          BOOK_AUTHOR: ${{ steps.lookup.outputs.author }}
          TARGET_FILE: ${{ inputs.target_file }}
        run: |
          git config --global user.email "benj@bkraft.fr"
          git config --global user.name "b3nj (via actions)"
          git add "$TARGET_FILE"
          git commit -m "📚 Add: ${BOOK_TITLE} - ${BOOK_AUTHOR}"
          git push